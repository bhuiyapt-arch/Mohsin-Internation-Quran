<html lang="bn"><head><meta charset="utf-8"><title>Noorani Qaida – ৪৫ দিনের প্ল্যান</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Playfair+Display:wght@600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#17191c;--sf:#1e2125;--sf2:#262a2e;--tx:#efebe3;--mu:#979fa3;--ac:#ec9b54;--ac2:#edc98e;--gr:#64d4a2;--ln:rgba(236,155,84,.34);--bd:#31363a;--c0:#ec9b54;--c1:#edc98e;--c2:#64d4a2;--c3:#86d6b6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif;line-height:1.55;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
.hd{text-align:center;padding:30px 16px 22px;background:linear-gradient(180deg,#1c2023,var(--bg));border-bottom:1px solid var(--ln)}
.hd .t{font-family:Amiri,"Noto Naskh Arabic",serif;font-size:40px;line-height:1.3;color:#fff}
.hd .e{font-family:"Playfair Display",Georgia,serif;font-size:19px;letter-spacing:.6px;color:var(--ac2);margin-top:2px}
.hd .b{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin-top:6px}
.wrap{max-width:820px;margin:0 auto;padding:16px 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-bottom:12px}
.st{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:11px 8px;text-align:center}
.st b{display:block;font-size:1.15rem;color:var(--ac)}.st span{font-size:11px;color:var(--mu);letter-spacing:.5px}
.pr{height:5px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:5px}.pr i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}
.pt{font-size:12px;color:var(--mu);text-align:right;margin-bottom:6px}
.ph{margin:24px 0 10px;padding:11px 14px;border-radius:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:600;background:var(--sf);border:1px solid var(--bd);border-left:3px solid var(--ac)}
.ph small{font-weight:400;color:var(--mu)}
.lr{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.lh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;margin-bottom:8px}.lh b{font-size:15px;font-weight:600}
.lh span{font-size:11.5px;font-weight:600;padding:3px 11px;border-radius:99px;border:1px solid var(--ln);color:var(--ac2)}
.ds{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.db{text-align:left;border:1px solid var(--bd);border-left-width:3px;border-radius:10px;background:var(--sf2);color:var(--tx);padding:8px 10px;font:inherit;cursor:pointer;position:relative;transition:border-color .15s,transform .15s}
.db:hover{border-color:var(--ln);transform:translateY(-1px)}
.db b{display:block;font-size:12.5px;color:var(--ac2)}.db span{display:block;font-size:12px;color:var(--mu)}.db.dn::after{content:"✓";position:absolute;top:6px;right:9px;color:var(--ac);font-weight:700}
.P0{border-left-color:var(--c0)}.P1{border-left-color:var(--c1)}.P2{border-left-color:var(--c2)}.P3{border-left-color:var(--c3)}
.back{border:1px solid var(--ln);background:transparent;color:var(--ac2);border-radius:20px;padding:7px 15px;font-size:13px;cursor:pointer;margin-bottom:12px}
.dh{text-align:center;margin:8px 0 12px}.dh .n{font-size:11px;letter-spacing:2.5px;color:var(--ac);font-weight:600}
.dh .ar{font-family:Amiri,serif;font-size:36px;color:#fff}.dh .en{font-family:"Playfair Display",Georgia,serif;font-size:19px}.dh .bn{color:var(--mu);font-size:14px}
.today{background:var(--sf2);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:14px;padding:13px 15px;margin:10px 0}
.today small{display:block;color:var(--ac);font-size:11px;letter-spacing:1.5px;text-transform:uppercase}.today b{font-size:17px;color:#fff}
.card0{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0}
.rule{border-left:3px solid var(--ac);font-size:14px;color:#e6ece9}.rule small{display:block;color:var(--mu);margin-top:5px}
.seg{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--bd);font-size:13px}.seg:first-of-type{border-top:0}.seg .t{color:var(--mu);white-space:nowrap}
.tl{display:flex;border-radius:8px;overflow:hidden;height:6px;margin:8px 0}.tl i{display:block}
.tm{font-size:13px;color:#e6ece9}.tm input{font:inherit;padding:4px 9px;border-radius:8px;border:1px solid var(--ln);background:var(--sf2);color:var(--tx);color-scheme:dark}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{border:1px solid var(--ln);background:linear-gradient(180deg,var(--sf2),var(--sf));border-radius:14px;padding:14px 6px;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--tx);font:inherit;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--ac);transform:translateY(-1px)}
.card .a{font-family:Amiri,"Noto Naskh Arabic","Traditional Arabic",serif;font-size:38px;line-height:1.5;direction:rtl;white-space:pre-wrap;color:#fff}
.card .r{display:none;font-size:13px;line-height:1.35;margin-top:5px;color:var(--mu)}.card .r b{display:block;color:var(--ac2);font-size:15px;font-weight:600}.card.open .r{display:block}
.line{grid-column:1/-1;padding:18px 10px}.line .a{font-size:34px}
.nav{display:flex;gap:8px;margin:18px 0}.nav button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font-size:14px;cursor:pointer}
.nav .pm{background:var(--ac);color:#0f1a14;font-weight:700;border-color:var(--ac)}.nav button:disabled{opacity:.35}
.qz{margin-top:14px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;text-align:center}
.qh{font-family:"Playfair Display",Georgia,serif;color:var(--ac2);font-size:16px}.qa{font-family:Amiri,serif;font-size:48px;direction:rtl;line-height:1.5;white-space:pre-wrap;color:#fff}
.qo{display:grid;grid-template-columns:1fr 1fr;gap:8px}.qo button{border:1px solid var(--bd);background:var(--sf2);color:var(--tx);border-radius:10px;padding:12px 6px;font-size:14px;cursor:pointer}
.qo .go{grid-column:1/-1;background:transparent;color:var(--ac);border-color:var(--ln)}.qo .ok{background:#1f7a4d;color:#fff;border-color:#1f7a4d}.qo .no{background:#8c2f3a;color:#fff;border-color:#8c2f3a}.qs{margin-top:8px;font-size:13px;color:var(--mu)}
.ck label{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd);font-size:14px}.ck label:first-child{border-top:0}.ck input{width:18px;height:18px;accent-color:var(--ac)}
.ft{text-align:center;color:var(--mu);font-size:12px;padding:10px 0 24px;border-top:1px solid var(--bd);margin-top:26px}@media print{body *{display:none!important}}

.hd{background:radial-gradient(ellipse at 50% 0,rgba(240,146,63,.18),transparent 65%),var(--bg);border-bottom:1px solid var(--ln)}
.hd .t{color:var(--ac2);text-shadow:0 0 28px rgba(240,146,63,.45)}.hd .e{color:#f3efe6}.hd .b{color:var(--mu)}
.st:nth-child(odd) b{color:var(--ac)}.st:nth-child(even) b{color:var(--gr)}
.pr i{background:linear-gradient(90deg,var(--ac),var(--ac2))}
.db.dn::after{color:var(--gr)}.ck input{accent-color:var(--gr)}
.db b{color:var(--ac2)}.dh .n{color:var(--ac)}.today small{color:var(--ac)}
.card,.lr,.today,.qz,.card0{box-shadow:0 0 0 1px rgba(255,255,255,.02),0 10px 30px rgba(0,0,0,.45)}
.card{border-radius:18px}.lr{border-radius:18px}
.nav .pm{background:linear-gradient(180deg,#f5a050,#dc7a2c);color:#1a0f05;border-color:transparent;box-shadow:0 6px 22px rgba(240,146,63,.35)}
.back{color:var(--ac2)}.qo .go{color:var(--ac)}

body{position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:0;pointer-events:none;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.16}
body::before{top:-25vmax;left:-15vmax;background:radial-gradient(circle,#ec9b54,transparent 65%);animation:drift1 22s ease-in-out infinite alternate}
body::after{bottom:-30vmax;right:-20vmax;background:radial-gradient(circle,#64d4a2,transparent 65%);animation:drift2 26s ease-in-out infinite alternate}
.hd,.wrap{position:relative;z-index:1}
.hd{background:radial-gradient(ellipse at 50% 0,rgba(236,155,84,.14),transparent 65%),transparent}
.hd .t{background:linear-gradient(100deg,#edc98e 20%,#fff3d6 45%,#edc98e 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;text-shadow:none;filter:drop-shadow(0 0 18px rgba(236,155,84,.35));animation:shine 7s linear infinite}
.hd .e,.hd .b{animation:rise .8s both}.hd .b{animation-delay:.15s}
.card,.lr,.today,.qz,.card0{box-shadow:0 8px 26px rgba(0,0,0,.28)}
#app.in>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
#app.in>*:nth-child(2){animation-delay:.05s}#app.in>*:nth-child(3){animation-delay:.1s}#app.in>*:nth-child(4){animation-delay:.15s}#app.in>*:nth-child(5){animation-delay:.2s}#app.in>*:nth-child(n+6){animation-delay:.25s}
.st{animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both}.st:nth-child(2){animation-delay:.06s}.st:nth-child(3){animation-delay:.12s}.st:nth-child(4){animation-delay:.18s}.st:nth-child(5){animation-delay:.24s}
.pr i{animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
.db{animation:rise .5s both}.db:nth-child(2){animation-delay:.04s}.db:nth-child(3){animation-delay:.08s}.db:nth-child(4){animation-delay:.12s}.db:nth-child(n+5){animation-delay:.16s}
.db:hover{box-shadow:0 6px 20px rgba(236,155,84,.16)}.db:active,.card:active,.nav button:active{transform:scale(.97)}
.db.dn::after{animation:pop .4s both}
.card{animation:pop .45s cubic-bezier(.2,.9,.3,1.1) both}.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}.card:nth-child(4){animation-delay:.12s}.card:nth-child(5){animation-delay:.16s}.card:nth-child(n+6){animation-delay:.2s}
.card:hover{box-shadow:0 0 0 1px var(--ac),0 10px 28px rgba(236,155,84,.2)}
.card .r{animation:rise .3s both}
.today{position:relative;overflow:hidden}.today::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(237,201,142,.10) 50%,transparent 65%);transform:translateX(-100%);animation:sweep 5s ease-in-out infinite}
.nav .pm{position:relative;overflow:hidden}.nav .pm::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);animation:sweep 4.2s ease-in-out infinite}
.qo button{transition:transform .15s,background .2s}.qo button:active{transform:scale(.97)}
.back,.nav button,.db,.card{transition:transform .15s,border-color .2s,box-shadow .2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes shine{to{background-position:-220% 0}}
@keyframes sweep{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
@keyframes drift1{to{transform:translate(12vmax,10vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-12vmax,-8vmax) scale(1.1)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>
